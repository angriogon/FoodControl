<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" fill="url(#bg)"/><g transform="translate(256 256) scale(0.78) translate(-256 -256)">

  <!-- Anillo de calorías: pista + progreso (75 %) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="30"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="895 1194" transform="rotate(-90 256 256)"/>

  <!-- Plato -->
  <circle cx="256" cy="256" r="148" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#D1FAE5" stroke-width="10"/>

  <!-- Llama de calorías -->
  <path d="M256 146 C 290 196, 336 222, 336 282 C 336 330, 300 360, 256 360 C 212 360, 176 330, 176 282 C 176 246, 198 222, 214 206 C 214 236, 228 254, 244 260 C 236 222, 240 182, 256 146 Z" fill="url(#flame)"/>
  <path d="M256 236 C 276 264, 300 280, 300 312 C 300 336, 280 350, 256 350 C 232 350, 212 336, 212 312 C 212 290, 232 276, 256 236 Z" fill="url(#core)"/>
</g></svg>
